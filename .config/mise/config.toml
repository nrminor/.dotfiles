min_version = "2026.8.2"

[bootstrap.repos]
"~/.local/share/agent-sources/autoresearch" = { url = "https://github.com/uditgoenka/autoresearch.git" }
"~/.local/share/agent-sources/nrminor-skills" = { url = "https://github.com/nrminor/skills.git" }

[bootstrap.packages]
# Homebrew formulae managed by mise during the staged migration from nix-darwin.
"brew:mas" = "latest"
"brew:gcc" = "latest"
"brew:lld" = "latest"
"brew:llvm" = "latest"
"brew:libiconv" = "latest"
"brew:sevenzip" = "latest"
"brew:opam" = "latest"

# macOS applications managed from Homebrew cask metadata
"brew-cask:ghostty" = "latest"
"brew-cask:zen" = "latest"
"brew-cask:figma" = "latest"
"brew-cask:slack" = "latest"
"brew-cask:discord" = "latest"
"brew-cask:signal" = "latest"
"brew-cask:visual-studio-code" = "latest"
"brew-cask:zoom" = "latest"
"brew-cask:font-symbols-only-nerd-font" = "latest"

# Mac App Store applications
"mas:497799835" = "latest"  # Xcode
"mas:1091189122" = "latest" # Bear
"mas:288545208" = "latest"  # Instapaper
"mas:430798174" = "latest"  # HazeOver
"mas:937984704" = "latest"  # Amphetamine

[dotfiles]
"~/.config/opencode/command" = { source = "~/.local/share/agent-sources/autoresearch/.opencode/commands", mode = "symlink-each" }
"~/.config/opencode/command/complete-next-task.md" = { source = "~/.local/share/agent-sources/nrminor-skills/.opencode/commands/complete-next-task.md" }
"~/.config/opencode/command/describe-commit.md" = { source = "~/.local/share/agent-sources/nrminor-skills/.opencode/commands/describe-commit.md" }
"~/.config/opencode/command/query.md" = { source = "~/.local/share/agent-sources/nrminor-skills/.opencode/commands/query.md" }
"~/.config/opencode/command/run-multiphase-review.md" = { source = "~/.local/share/agent-sources/nrminor-skills/.opencode/commands/run-multiphase-review.md" }
"~/.config/opencode/command/tidy-commit-graph.md" = { source = "~/.local/share/agent-sources/nrminor-skills/.opencode/commands/tidy-commit-graph.md" }
"~/.config/opencode/command/update-working-document.md" = { source = "~/.local/share/agent-sources/nrminor-skills/.opencode/commands/update-working-document.md" }

[tools]
"aqua:dlvhdr/gh-dash" = "latest"
"aqua:ouch-org/ouch" = "latest"
"aqua:skim-rs/skim" = "latest"
ast-grep = "latest"
atuin = "latest"
aube = "latest"
bat = "latest"
carapace = "latest"
difftastic = "latest"
dua = "latest"
dust = "latest"
eza = "latest"
fastfetch = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
git-cliff = "latest"
"github:agavra/tuicr" = "latest"
"github:astral-sh/hawk" = "latest"
"github:bahdotsh/wrkflw" = "latest"
"github:bede/skope" = "latest"
"github:jnsahaj/lumen" = "latest"
herdr = "latest"
hk = "latest"
hyperfine = "latest"
jq = "latest"
jujutsu = "latest"
lazygit = "latest"
node = "latest"
neovim = "0.12.4"
"npm:scriptc" = "latest"
nub = { version = "latest", allow_builds = ["@nubjs/nub"] }
opencode = "latest"
pixi = "latest"
pnpm = "latest"
rclone = "latest"
release-plz = "latest"
ripgrep = "latest"
ripgrep-all = "latest"
starship = "latest"
superhtml = "latest"
tmux = "latest"
tree-sitter = "latest"
uv = "latest"
vp = "latest"
zellij = "latest"
zoxide = "latest"

[tasks.bootstrap]
description = "Bootstrap mutable user-level state"
run = [{ task = "skills:sync" }]
