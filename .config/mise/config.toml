[tasks."skills:sync"]
description = "Install or refresh globally managed agent skills"
tools = { node = "24", nub = "0.5" }
run = "nu ~/.dotfiles/scripts/sync-skills.nu"

[tasks."nu:plugins"]
description = "Regenerate the Nushell plugin registry"
run = "nu --no-config-file ~/.dotfiles/.config/nushell/plugins.nu"

[tasks."yazi:packages"]
description = "Install locked Yazi plugins and flavors"
run = """
nu --no-config-file --commands '
  for name in [plugins flavors] {
    let path = $env.HOME | path join ".config" "yazi" $name
    if ($path | path exists) { rm --recursive --force $path }
  }
'
ya pkg install --discard
nu --no-config-file ~/.config/nushell/theme.nu sync yazi
"""

[tasks.bootstrap]
description = "Bootstrap mutable user-level state"
run = [{ task = "setup" }, { task = "yazi:packages" }, { task = "skills:sync" }]
