min_version = "2026.10.22"

[bootstrap.packages]
# Homebrew formulae managed by mise during the staged migration from nix-darwin.
"brew:mas" = "latest"
"brew:gcc" = "latest"
"brew:lld" = "latest"
"brew:llvm" = "latest"
"brew:libiconv" = "latest"
"brew:opam" = "latest"

# macOS applications managed from Homebrew cask metadata
"brew-cask:ghostty" = "latest"
"brew-cask:zen" = "latest"
"brew-cask:figma" = "latest"
"brew-cask:slack" = "latest"
"brew-cask:discord" = "latest"
"brew-cask:signal" = "latest"
"brew-cask:visual-studio-code" = "latest"
"brew-cask:zoom" = "latest"
"brew-cask:font-symbols-only-nerd-font" = "latest"
"brew-cask:font-jetbrains-mono-nerd-font" = "latest"

# Mac App Store applications
"mas:497799835" = "latest"  # Xcode
"mas:1091189122" = "latest" # Bear
"mas:288545208" = "latest"  # Instapaper
"mas:430798174" = "latest"  # HazeOver
"mas:937984704" = "latest"  # Amphetamine

[bootstrap.user]
login_shell = "/bin/zsh"

[bootstrap.directories."~/Documents"]
mode = "0700"

[bootstrap.directories."~/Documents/bioinformatics"]
mode = "0755"

[bootstrap.directories."~/Documents/hacking"]
mode = "0755"

[bootstrap.directories."~/Documents/screenshots"]
mode = "0755"

[dotfiles]
"~/.config/rex/init.lua" = { source = "~/.dotfiles/.config/rex/init.lua" }
"~/.local/bin/rex" = { source = "~/.dotfiles/scripts/rex.sh" }
"~/.config/herdr-core/config.toml/shell" = { source = "~/.dotfiles/.config/herdr-core/config.toml", merge = true, template = "tera" }
"~/.config/herdr-app/settings.json/preferences" = { source = "~/.dotfiles/.config/herdr-app/settings.json", merge = true }
"~/.config/herdr-app/keys.json/shortcuts" = { source = "~/.dotfiles/.config/herdr-app/keys.json", merge = true }
"~/.config/herdr-app/themes/catppuccin-macchiato.json" = { source = "~/.dotfiles/.config/herdr-app/themes/catppuccin-macchiato.json" }
"~/Library/Application Support/mbx/config.toml" = { source = "~/.dotfiles/.config/mbx/config.toml" }
"~/Library/Application Support/com.mitchellh.ghostty/config" = { source = "~/.dotfiles/.config/ghostty/config" }
"~/Library/Application Support/tlrc/config.toml" = { source = "~/.dotfiles/.config/tlrc/config.toml" }
"~/Library/Application Support/nushell/vendor/autoload/starship.nu" = { source = "~/.dotfiles/.config/nushell/starship.nu" }
"~/Library/Application Support/nushell/vendor/autoload/macos.nu" = { source = "~/.dotfiles/.config/nushell/macos.nu" }
"~/Library/Caches/nushell/carapace.nu" = { source = "~/.dotfiles/.config/nushell/carapace.nu" }

[tasks."rex:install"]
description = "Install Rex Beta if missing; leave existing installations and updates alone"
run = "sh ~/.dotfiles/scripts/install-rex.sh"

[tasks."rex:setup"]
description = "Apply Rex preferences to the connected Mac client"
run = "nu --no-config-file ~/.dotfiles/scripts/rex.nu setup"

[tasks."rex:check"]
description = "Check deployed Rex configuration and connected client capabilities"
run = "nu --no-config-file ~/.dotfiles/scripts/rex.nu check"

[tasks."herdr:desktop:install"]
description = "Install Herdr Desktop if missing, leaving the TUI and existing apps alone"
run = "nu --no-config-file ~/.dotfiles/scripts/herdr-desktop.nu install"

[tasks."herdr:desktop:setup"]
description = "Back up and merge managed Herdr Desktop preferences"
run = "nu --no-config-file ~/.dotfiles/scripts/herdr-desktop.nu setup"

[tasks."herdr:desktop:check"]
description = "Check Herdr Desktop bindings and deployed preferences"
run = "nu --no-config-file ~/.dotfiles/scripts/herdr-desktop.nu check"
