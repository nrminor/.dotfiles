[bootstrap.packages]
# Homebrew formulae managed by mise during the staged migration from nix-darwin.
"brew:mas" = "latest"
"brew:gcc" = "latest"
"brew:lld" = "latest"
"brew:llvm" = "latest"
"brew:libiconv" = "latest"
"brew:opam" = "latest"

# macOS applications managed from Homebrew cask metadata
"brew-cask:ghostty" = "latest"
"brew-cask:zen" = "latest"
"brew-cask:figma" = "latest"
"brew-cask:slack" = "latest"
"brew-cask:discord" = "latest"
"brew-cask:signal" = "latest"
"brew-cask:visual-studio-code" = "latest"
"brew-cask:zoom" = "latest"
"brew-cask:font-symbols-only-nerd-font" = "latest"

# Mac App Store applications
"mas:497799835" = "latest"  # Xcode
"mas:1091189122" = "latest" # Bear
"mas:288545208" = "latest"  # Instapaper
"mas:430798174" = "latest"  # HazeOver
"mas:937984704" = "latest"  # Amphetamine

[bootstrap.user]
login_shell = "/bin/zsh"

[dotfiles]
"~/Library/Application Support/com.mitchellh.ghostty/config" = { source = "~/.dotfiles/.config/ghostty/config" }
"~/Library/Application Support/tlrc/config.toml" = { source = "~/.dotfiles/.config/tlrc/config.toml" }
"~/Library/Application Support/nushell/vendor/autoload/starship.nu" = { source = "~/.dotfiles/.config/nushell/starship.nu" }
"~/Library/Application Support/nushell/vendor/autoload/macos.nu" = { source = "~/.dotfiles/.config/nushell/macos.nu" }
"~/Library/Caches/nushell/carapace.nu" = { source = "~/.dotfiles/.config/nushell/carapace.nu" }
