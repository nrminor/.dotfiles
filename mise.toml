#:schema https://mise.jdx.dev/schema/mise.json

min_version = "2026.8.2"

[tools]
node = "26"
nub = { version = "0.9" }
prek = "0.5.5"

[env]
_.path = "node_modules/.bin"

[tasks."tools:install"]
description = "Install project tools declared in mise.toml"
run = "mise install"

[tasks."deps:install"]
description = "Install locked dependencies and build the pinned Rex SDK"
tools = { pnpm = "12.16.1" }
run = [
  "nub install --frozen-lockfile",
  "nub --cwd .config/pi/extensions/mpl install --frozen-lockfile",
  "nu --no-config-file scripts/install-rex-sdk.nu",
  "nub --cwd .config/opencode/plugins/rex install --frozen-lockfile",
  "nub --cwd .config/pi/extensions/rex install --frozen-lockfile",
]

[tasks."hooks:install"]
description = "Install repository hooks with Prek"
run = "prek install --overwrite"

[tasks."hooks:run"]
description = "Run all Prek hooks against the repository"
run = "prek run --all-files"

[tasks."hooks:update"]
description = "Update pinned Prek hook revisions"
run = "prek auto-update"

[tasks."hooks:uninstall"]
description = "Remove installed Prek hooks"
run = "prek uninstall"
